name = "tally-relay"
main = "src/index.ts"
compatibility_date = "2024-09-09"

# The relay needs NO secrets and NO environment variables. It stores only signed
# public entries, and it is untrusted by design — see README.md. There is
# nothing here to leak, which is a deliberate property of the architecture.

# D1 binding. `database_id` is filled in by scripts/deploy.sh (or by hand after
# `pnpm --filter @tally/relay db:create`). The id is NOT a secret — it is an
# account-scoped resource handle that is useless without your Cloudflare login.
[[d1_databases]]
binding = "DB"
database_name = "tally-relay"
database_id = "e8aea306-3be6-48fa-b74f-dd3de809ee05"
migrations_dir = "migrations"

[observability]
enabled = true
