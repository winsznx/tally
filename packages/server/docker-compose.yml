# Tally API and its PostgreSQL. Run from this directory:
#   cp .env.example .env   # fill in POSTGRES_PASSWORD and CORS_ORIGINS
#   docker compose up -d --build
name: tally

services:
  api:
    build:
      context: ../..
      dockerfile: packages/server/Dockerfile
    image: tally-api:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tally:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@tally-db:5432/tally
      PORT: "8080"
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${TALLY_API_PORT:-8797}:8080"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # A unique name: on a shared proxy network another project's "db" can shadow ours.
    networks:
      default:
        aliases: [tally-db]
    environment:
      POSTGRES_USER: tally
      POSTGRES_DB: tally
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - tally-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tally -d tally"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tally-db:
